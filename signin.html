                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navbar links -->





                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item fw-bold"><a class="text-success nav-link active"

    <main>





        <div class="container">
            <div class="row justify-content-center mt-6">
                <div style="margin-top: 200px;"
                    class="bg-secondary text-white text-center p-4 border rounded shadow col-12 col-md-6 col-lg-6">
                    <h3 id="h3">Please sign in:</h3><br>
                    <form id="signin">
                        <div class="mb-3">
                            <label for="userName" class="form-label ">User Name:&nbsp;</label>
                            <input type="text" class="form-control" id="userName" name="userName" required
                                autofocus><br>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:&nbsp;</label>
                            <input type="password" class="form-control" id="password" name="password"
                                pattern="[A-Za-z0-9]{8,}" required>

                        </div>

                        <br><button class="btn btn-success border" type="submit">Sign In</button><br><br>

                    </form>
                    <a class="text-info" href="./signup.html">Sign up here</a><br>
                    <span id="mesToShow" class="text-warning"></span>
                </div>
            </div>
        </div>
